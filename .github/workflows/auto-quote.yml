name: Auto Quote Commits

on:
  schedule:
    # Every day at 18:00 UTC
    - cron: "0 18 * * *"
  workflow_dispatch: {}  # allow manual triggering

permissions:
  contents: write

jobs:
  auto-quote-commit:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        # Optional: use your PAT to make "pusher" your account instead of GitHub Actions
        # with:
        #   token: ${{ secrets.PAT }}

      - name: Configure git identity
        env:
          GIT_AUTHOR_NAME: ${{ secrets.GIT_AUTHOR_NAME }}
          GIT_AUTHOR_EMAIL: ${{ secrets.GIT_AUTHOR_EMAIL }}
        run: |
          git config user.name  "${GIT_AUTHOR_NAME}"
          git config user.email "${GIT_AUTHOR_EMAIL}"
          echo "GIT_AUTHOR_NAME=${GIT_AUTHOR_NAME}"      >> $GITHUB_ENV
          echo "GIT_AUTHOR_EMAIL=${GIT_AUTHOR_EMAIL}"    >> $GITHUB_ENV
          echo "GIT_COMMITTER_NAME=${GIT_AUTHOR_NAME}"   >> $GITHUB_ENV
          echo "GIT_COMMITTER_EMAIL=${GIT_AUTHOR_EMAIL}" >> $GITHUB_ENV

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run quote auto-commit script
        run: python auto_quotes.py

      - name: Commit changes (if any)
        run: |
          git add -A
          if ! git diff --staged --quiet; then
            git commit -m "Auto: update daily quote"
          else
            echo "No changes to commit."
          fi

      - name: Push commits (if any)
        run: git push origin HEAD
